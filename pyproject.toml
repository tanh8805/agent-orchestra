[project]
name = "multi-agent"
version = "0.1.0"
description = "Multi-Agent project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langchain-anthropic>=1.7.6",
    "langchain-google-genai>=4.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db", "src/llm"]
